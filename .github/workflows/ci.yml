name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — ruff y pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check bats_core tests

      # Solo lo esencial: fórmula de MVP, reglas, forma canónica, auth e ingesta.
      # El resto de tests/ se corre en local.
      - name: pytest
        run: pytest -v tests/test_mvp.py tests/test_rules.py tests/test_teamset.py tests/test_auth.py tests/test_ingest.py tests/test_arena_flags.py tests/test_vercel_config.py

  frontend-checks:
    name: Frontend — lint y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: Type-check + build (tsc -b && vite build)
        run: npm run build

  motor:
    name: Motor — tsc y vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Type-check
        run: npm run motor:typecheck

      - name: vitest
        run: npm run motor:test

  # Pruebas contra Postgres real: esquema `arena`, repositorio con bloqueo, concurrencia (I4) y la
  # partida completa por HTTP. La base se llama `..._test` y NO es BATS_DB_DSN (guardia I13).
  integracion:
    name: Integración — Postgres, pytest de arena y motor
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bats_arena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BATS_TEST_DSN: postgresql://postgres:postgres@localhost:5432/bats_arena_test
      MOTOR_DB_OBLIGATORIA: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: |
          pip install -r requirements-dev.txt
          npm ci

      - name: Aplicar el esquema a la base desechable
        run: python -m bats_core db --apply-schema --dsn "$BATS_TEST_DSN"

      - name: pytest de arena
        run: pytest -v tests/test_arena_*.py

      - name: vitest con base de datos
        run: npm run motor:test:db

  # Solo main despliega: las ramas y los PRs únicamente corren los checks.
  deploy:
    name: Deploy a Vercel (producción)
    runs-on: ubuntu-latest
    needs: [backend, frontend-checks, motor, integracion]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Vercel pull
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Vercel build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Vercel deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
